<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anagram Solver</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 2rem 1rem;
      color: #2d3748;
    }

    .container { max-width: 820px; margin: 0 auto; }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #718096;
      margin-bottom: 1.75rem;
      font-size: 0.95rem;
    }

    .subtitle span {
      display: inline-block;
      background: #e9d8fd;
      color: #6b46c1;
      border-radius: 4px;
      padding: 0 5px;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0 2px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 1.5rem;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
      align-items: stretch;
    }

    .letter-input {
      flex: 1;
      padding: 0.8rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1.3rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
      color: #2d3748;
      transition: border-color 0.2s;
    }

    .letter-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }

    .solve-btn {
      padding: 0.8rem 1.75rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.2s, transform 0.1s;
    }

    .solve-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .solve-btn:active:not(:disabled) { transform: translateY(0); }
    .solve-btn:disabled { background: #cbd5e0; cursor: not-allowed; }

    .filters {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-group label {
      font-size: 0.875rem;
      color: #718096;
      font-weight: 500;
    }

    .filter-group input[type="number"] {
      width: 64px;
      padding: 0.35rem 0.5rem;
      border: 2px solid #e2e8f0;
      border-radius: 7px;
      font-size: 0.9rem;
      text-align: center;
      color: #2d3748;
    }

    .filter-group input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .status-bar {
      margin-top: 1rem;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-bar.loading { background: #ebf8ff; color: #2b6cb0; }
    .status-bar.error   { background: #fff5f5; color: #c53030; }
    .status-bar.ready   { background: #f0fff4; color: #276749; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .progress {
      height: 3px;
      background: #bee3f8;
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #3182ce;
      border-radius: 2px;
      transition: width 0.4s;
      width: 0%;
    }

    /* Results */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .results-header h2 { font-size: 1.25rem; }

    .count-badge {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .length-section { margin-bottom: 1.25rem; }

    .length-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a0aec0;
      margin-bottom: 0.5rem;
    }

    .words-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .word-chip {
      background: #edf2f7;
      color: #2d3748;
      padding: 0.35rem 0.75rem;
      border-radius: 7px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
      user-select: none;
    }

    .word-chip:hover {
      background: #667eea;
      color: white;
      transform: translateY(-1px);
    }

    .word-chip:active { transform: none; }

    .word-chip.copied {
      background: #48bb78;
      color: white;
    }

    .no-results {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #a0aec0;
      font-size: 1rem;
    }

    .no-results .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

    .legend {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      color: #718096;
    }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
    }

    .working-indicator {
      display: none;
      align-items: center;
      gap: 0.5rem;
      color: #667eea;
      font-size: 0.875rem;
      font-weight: 500;
      margin-top: 0.75rem;
    }

    .working-indicator.visible { display: flex; }
  </style>
</head>
<body>

<div class="container">
  <h1>Anagram Solver</h1>
  <p class="subtitle">
    Enter letters &mdash; every letter you provide must appear
    <span>at least once</span> in each result, and letters may be reused freely.
  </p>

  <div class="card">
    <div class="input-row">
      <input
        class="letter-input"
        type="text"
        id="letters"
        placeholder="e.g. ASTR"
        maxlength="15"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="characters"
        spellcheck="false"
      >
      <button class="solve-btn" id="solveBtn" onclick="solve()" disabled>Solve</button>
    </div>

    <div class="filters">
      <div class="filter-group">
        <label for="minLen">Min length</label>
        <input type="number" id="minLen" value="3" min="1" max="30">
      </div>
      <div class="filter-group">
        <label for="maxLen">Max length</label>
        <input type="number" id="maxLen" value="12" min="1" max="30">
      </div>
    </div>

    <div class="working-indicator" id="workingIndicator">
      <div class="spinner"></div>
      Searching&hellip;
    </div>

    <div class="status-bar loading" id="statusBar">
      <div class="spinner"></div>
      <div>
        <div>Loading dictionary&hellip;</div>
        <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>
  </div>

  <div class="card" id="resultsCard" style="display:none">
    <div class="results-header">
      <h2>Results</h2>
      <span class="count-badge" id="countBadge">0 words</span>
    </div>
    <div id="results"></div>
    <p style="margin-top:1rem;font-size:0.8rem;color:#a0aec0">
      Click any word to copy it to the clipboard.
    </p>
  </div>
</div>

<script>
  let wordList = [];

  /* ── Dictionary loading ── */
  async function loadWordList() {
    const statusBar    = document.getElementById('statusBar');
    const progressFill = document.getElementById('progressFill');
    const solveBtn     = document.getElementById('solveBtn');

    // Simulate progress while the large file streams in
    let fakeProgress = 0;
    const ticker = setInterval(() => {
      fakeProgress = Math.min(fakeProgress + Math.random() * 3, 90);
      progressFill.style.width = fakeProgress + '%';
    }, 200);

    const CACHE_KEY = 'anagram_solver_wordlist_v1';

    // Serve from localStorage cache when available (works offline too)
    try {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached && cached.length > 1000) {
        wordList = cached.split('\n').filter(w => w.length > 0);
        clearInterval(ticker);
        progressFill.style.width = '100%';
        statusBar.className = 'status-bar ready';
        statusBar.innerHTML =
          `&#10003; Dictionary ready &mdash; ${wordList.length.toLocaleString()} words loaded`;
        solveBtn.disabled = false;
        document.getElementById('letters').focus();
        return;
      }
    } catch (_) {} // localStorage may be blocked (e.g. private browsing)

    // Primary URL + CORS-proxy mirrors so the file works when opened
    // directly from disk (file://) in Edge and other strict browsers.
    const PRIMARY   = 'https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt';
    const FALLBACK  = 'https://raw.githubusercontent.com/first20hours/google-10000-english/master/20k.txt';
    const PROXY     = u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u);

    const sources = [
      PRIMARY,
      PROXY(PRIMARY),
      FALLBACK,
      PROXY(FALLBACK),
    ];

    let text = null;
    for (const url of sources) {
      try {
        const res = await fetch(url);
        if (!res.ok) continue;
        text = await res.text();
        if (text.length > 1000) break;
      } catch (_) { continue; }
    }

    try {
      if (!text || text.length < 100) throw new Error('No usable word list retrieved');

      // Handle \n, \r\n, and \r line endings
      wordList = text.split(/\r?\n|\r/)
        .map(w => w.trim().toLowerCase())
        .filter(w => w.length > 0 && /^[a-z]+$/.test(w));

      // Cache for future loads (ignore quota errors)
      try { localStorage.setItem(CACHE_KEY, wordList.join('\n')); } catch (_) {}

      clearInterval(ticker);
      progressFill.style.width = '100%';

      statusBar.className = 'status-bar ready';
      statusBar.innerHTML =
        `&#10003; Dictionary ready &mdash; ${wordList.length.toLocaleString()} words loaded`;

      solveBtn.disabled = false;
      document.getElementById('letters').focus();

    } catch (err) {
      clearInterval(ticker);
      statusBar.className = 'status-bar error';
      statusBar.innerHTML =
        '&#9888; Could not load dictionary. Check your internet connection and refresh.';
      console.error(err);
    }
  }

  /* ── Solver ── */

  /**
   * Returns true when `word` satisfies both constraints:
   *   1. Every character of the word comes from `letterSet`.
   *   2. Every letter in `requiredLetters` appears at least once in the word.
   */
  function isValid(word, letterSet, requiredLetters) {
    for (let i = 0; i < word.length; i++) {
      if (!letterSet.has(word[i])) return false;
    }
    for (let i = 0; i < requiredLetters.length; i++) {
      if (!word.includes(requiredLetters[i])) return false;
    }
    return true;
  }

  function solve() {
    const raw = document.getElementById('letters').value.toLowerCase();
    const clean = raw.replace(/[^a-z]/g, '');

    if (!clean) {
      alert('Please enter at least one letter (a–z).');
      return;
    }
    if (!wordList.length) {
      alert('Dictionary is still loading — please wait a moment.');
      return;
    }

    const minLen = Math.max(1, parseInt(document.getElementById('minLen').value) || 1);
    const maxLen = Math.max(minLen, parseInt(document.getElementById('maxLen').value) || 12);

    const letterSet      = new Set(clean);
    const requiredLetters = [...letterSet];

    /* Run on next tick so the browser can repaint the "Searching…" indicator */
    document.getElementById('workingIndicator').classList.add('visible');
    document.getElementById('solveBtn').disabled = true;

    setTimeout(() => {
      const matches = wordList.filter(w =>
        w.length >= minLen && w.length <= maxLen && isValid(w, letterSet, requiredLetters)
      );

      renderResults(matches);

      document.getElementById('workingIndicator').classList.remove('visible');
      document.getElementById('solveBtn').disabled = false;
    }, 20);
  }

  /* ── Rendering ── */
  function renderResults(matches) {
    const card      = document.getElementById('resultsCard');
    const resultsEl = document.getElementById('results');
    const badge     = document.getElementById('countBadge');

    badge.textContent = `${matches.length} word${matches.length !== 1 ? 's' : ''}`;
    card.style.display = 'block';

    if (matches.length === 0) {
      resultsEl.innerHTML = `
        <div class="no-results">
          <div class="icon">&#128269;</div>
          No words found. Try different letters or wider length limits.
        </div>`;
      card.scrollIntoView({ behavior: 'smooth' });
      return;
    }

    /* Group by word length */
    const byLen = {};
    for (const w of matches) {
      (byLen[w.length] = byLen[w.length] || []).push(w);
    }

    const sections = Object.keys(byLen)
      .map(Number)
      .sort((a, b) => a - b)
      .map(len => {
        const chips = byLen[len]
          .map(w => `<span class="word-chip" onclick="copyWord(this,'${w}')">${w}</span>`)
          .join('');
        return `
          <div class="length-section">
            <div class="length-label">${len} letter${len !== 1 ? 's' : ''} &mdash; ${byLen[len].length}</div>
            <div class="words-grid">${chips}</div>
          </div>`;
      })
      .join('');

    resultsEl.innerHTML = sections;
    card.scrollIntoView({ behavior: 'smooth' });
  }

  /* ── Clipboard ── */
  function copyWord(el, word) {
    navigator.clipboard.writeText(word).catch(() => {});
    el.classList.add('copied');
    el.textContent = word + ' ✓';
    setTimeout(() => {
      el.classList.remove('copied');
      el.textContent = word;
    }, 1200);
  }

  /* ── Keyboard shortcut ── */
  document.getElementById('letters').addEventListener('keydown', e => {
    if (e.key === 'Enter') solve();
  });

  /* ── Boot ── */
  loadWordList();
</script>
</body>
</html>
